[project]
name = "skrl"
version = "1.4.3"
description = "Modular and flexible library for reinforcement learning on PyTorch and JAX"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT License" }
authors = [{ name = "Toni-SM" }]
maintainers = [{ name = "Toni-SM" }]
keywords = [
    "reinforcement-learning",
    "machine-learning",
    "reinforcement",
    "machine",
    "learning",
    "rl",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# dependencies / optional-dependencies
dependencies = [
    "brax>=0.13.0",
    "diffusers>=0.35.2",
    "dm-control>=1.0.34",
    "gdown>=5.2.0",
    "gym>=0.26.2",
    "gym-pusht==0.1.5",
    "gymnasium==1.2.0",
    "jax[cuda12]>=0.8.0",
    "jaxlie>=1.5.0",
    "mediapy>=1.2.5",
    "mujoco==3.5.0",
    "mujoco-mjx==3.5.0",
    "mujoco-warp==3.5.0",
    "opencv-python>=4.12.0.88",
    "packaging",
    "playground>=0.0.5",
    "pygame==2.6.1",
    "pymunk==6.6.0",
    "pyspacemouse>=1.1.5",
    "robot-descriptions>=1.21.0",
    "shapely>=2.1.2",
    "spatialmath-python>=1.1.14",
    "tensorboard",
    "torch==2.8.0",
    "torch-vision>=0.1.6.dev0",
    "tqdm",
    "wandb[media]>=0.22.2",
    "warp>=1.0.4",
    "warp-lang==1.11.1",
    "zarr>=3.1.5",
]
[project.optional-dependencies]
torch = ["torch>=1.10"]
jax = ["jax>=0.4.31", "jaxlib>=0.4.31", "flax>=0.9.0", "optax"]
all = ["torch>=1.10", "jax>=0.4.31", "jaxlib>=0.4.31", "flax>=0.9.0", "optax"]
tests = ["pytest", "pytest-html", "pytest-cov", "hypothesis"]
# urls
[project.urls]
"Homepage" = "https://github.com/Toni-SM/skrl"
"Documentation" = "https://skrl.readthedocs.io"
"Discussions" = "https://github.com/Toni-SM/skrl/discussions"
"Bug Reports" = "https://github.com/Toni-SM/skrl/issues"
"Say Thanks!" = "https://github.com/Toni-SM"
"Source" = "https://github.com/Toni-SM/skrl"


[tool.black]
line-length = 120
extend-exclude = """
(
  ^/docs
)
"""


[tool.codespell]
# run: codespell <folder>
skip = "./docs/source/_static,./docs/_build,pyproject.toml"
quiet-level = 3
count = true


[tool.isort]
profile = "black"
line_length = 120
lines_after_imports = 2
known_test = ["warnings", "hypothesis", "pytest"]
known_annotation = ["typing"]
known_framework = ["torch", "jax", "jaxlib", "flax", "optax", "numpy"]
sections = [
    "FUTURE",
    "ANNOTATION",
    "TEST",
    "STDLIB",
    "THIRDPARTY",
    "FRAMEWORK",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
no_lines_before = "THIRDPARTY"
skip = ["docs"]
